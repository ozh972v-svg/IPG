// ===== СОСТОЯНИЕ =====
let quiz = [];
let current = 0;
let userAnswers = [];

// ===== УТИЛИТЫ =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const shuffledBank = shuffle(QUESTION_BANK);
  quiz = shuffledBank.slice(0, Math.min(QUESTIONS_PER_TEST, QUESTION_BANK.length));
  current = 0;
  userAnswers = quiz.map(() => null);
  renderQuestion();
}

// ===== ОТРИСОВКА =====
const app = document.getElementById('app');

function renderQuestion() {
  const q = quiz[current];
  const selected = userAnswers[current] || [];

  let html = `
    <div class="card">
      <div class="progress-bar">
        <div class="progress-fill" style="width:${((current)/quiz.length)*100}%"></div>
      </div>
      <div class="progress-text">Вопрос ${current + 1} из ${quiz.length}</div>
      <span class="badge ${q.type === 'multi' ? 'multi' : ''}">${q.type === 'multi' ? 'Несколько ответов' : 'Один ответ'}</span>
      <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    const isSel = selected.includes(i);
    html += `
      <label class="option ${isSel ? 'selected' : ''}" data-idx="${i}">
        <input type="${q.type === 'multi' ? 'checkbox' : 'radio'}" name="q" ${isSel ? 'checked' : ''}>
        <span>${opt}</span>
      </label>
    `;
  });

  const canNext = selected.length > 0;
  html += `<button class="btn btn-primary" id="nextBtn" ${canNext ? '' : 'disabled'}>
    ${current === quiz.length - 1 ? 'Завершить тест' : 'Далее'}
  </button>`;
  html += `</div>`;

  app.innerHTML = html;

  document.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const idx = parseInt(el.dataset.idx);
      let sel = [...(userAnswers[current] || [])];
      if (q.type === 'multi') {
        if (sel.includes(idx)) sel = sel.filter(x => x !== idx);
        else sel.push(idx);
      } else {
        sel = [idx];
      }
      userAnswers[current] = sel;
      renderQuestion();
    });
  });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', () => {
    if (current < quiz.length - 1) {
      current++;
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

function arraysEqual(a, b) {
  if (!a || !b) return false;
  if (a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function renderResults() {
  let correctCount = 0;
  const review = [];

  quiz.forEach((q, i) => {
    const userAns = userAnswers[i] || [];
    const isCorrect = arraysEqual(userAns, q.correct);
    if (isCorrect) correctCount++;
    review.push({ q, userAns, isCorrect });
  });

  const percent = Math.round((correctCount / quiz.length) * 100);
  const pass = percent >= PASS_THRESHOLD;

  let html = `
    <div class="card">
      <h1>Результат</h1>
      <div class="result-score ${pass ? 'pass' : 'fail'}">${percent}%</div>
      <div class="result-label">${pass ? '✅ Тест пройден' : '❌ Тест не пройден'} (порог ${PASS_THRESHOLD}%)</div>
      <div class="stat-row"><span>Правильных ответов</span><b>${correctCount} из ${quiz.length}</b></div>
      <div class="stat-row"><span>Ошибок</span><b>${quiz.length - correctCount}</b></div>
    </div>
  `;

  if (correctCount < quiz.length) {
    html += `<div class="card"><h1>Разбор ошибок</h1>`;
    review.forEach((r, i) => {
      if (r.isCorrect) return;
      html += `<div class="review-item">
        <div class="review-q">${i + 1}. ${r.q.q}</div>
        <div class="review-summary">
          <div><b>Ваш ответ:</b> ${r.userAns.length ? r.userAns.map(x => '«' + r.q.options[x] + '»').join(', ') : '— не отвечено —'}</div>
          <div><b>Правильно:</b> ${r.q.correct.map(x => '«' + r.q.options[x] + '»').join(', ')}</div>
        </div>
      `;
      r.q.options.forEach((opt, oi) => {
        const isUser = r.userAns.includes(oi);
        const isCorr = r.q.correct.includes(oi);
        let cls = '';
        let mark = '';
        if (isCorr && isUser) { cls = 'user-correct'; mark = ' ✓ (выбрано верно)'; }
        else if (isCorr && !isUser) { cls = 'correct'; mark = ' ✓ (пропущено)'; }
        else if (!isCorr && isUser) { cls = 'user-wrong'; mark = ' ✗ (лишнее)'; }
        if (cls) html += `<div class="review-a ${cls}">${opt}${mark}</div>`;
      });
      html += `
        <div class="source-block">
          <div class="source-title">📖 Источник в документе</div>
          <div class="source-ref">Раздел ${r.q.section} · ${r.q.ref}</div>
          <div class="source-text">«${r.q.source}»</div>
        </div>
      `;
      html += `</div>`;
    });
    html += `</div>`;
  }

  html += `<button class="btn btn-primary" onclick="location.reload()">Пройти заново</button>`;
  html += `<div class="hint">Всего в банке: ${QUESTION_BANK.length} вопросов · в тесте: ${quiz.length}</div>`;

  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ===== СТАРТ =====
startQuiz();
</script>
