<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рабочее место инженера по гарантии</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg-1: #eef2ff;
    --bg-2: #f5f3ff;
    --bg-3: #ecfeff;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --blue: #2563eb;
    --green: #059669;
    --violet: #7c3aed;
  }

  html, body {
    min-height: 100vh;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background:
      radial-gradient(1200px 600px at 0% 0%, #dbeafe 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #ede9fe 0%, transparent 55%),
      radial-gradient(900px 700px at 50% 100%, #cffafe 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.5;
    padding: 32px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 1100px;
  }

  #loading {
    text-align: center;
    padding: 120px 20px;
    color: var(--ink-soft);
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  #loading::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 28px;
    border: 3px solid rgba(37,99,235,0.15);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============ Шапка ============ */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 36px;
    padding: 20px 26px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 12px 40px rgba(30, 64, 175, 0.08);
    animation: fadeDown 0.5s ease-out both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-logo {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .brand-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .user-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
  }

  .user-nav .uname {
    color: var(--ink-soft);
    padding-right: 12px;
    border-right: 1px solid rgba(15, 23, 42, 0.08);
  }

  .user-nav .uname b {
    color: var(--ink);
    font-weight: 600;
  }

  .user-nav a {
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.18s;
    letter-spacing: 0.01em;
  }

  .user-nav a:hover {
    transform: translateY(-1px);
  }

  .user-nav a.profile {
    color: #1d4ed8;
    background: rgba(219, 234, 254, 0.9);
  }
  .user-nav a.profile:hover { background: #bfdbfe; }

  .user-nav a.admin {
    color: #b91c1c;
    background: rgba(254, 226, 226, 0.9);
  }
  .user-nav a.admin:hover { background: #fecaca; }

  .user-nav a.logout {
    color: #475569;
    background: rgba(241, 245, 249, 0.9);
  }
  .user-nav a.logout:hover { background: #e2e8f0; }

  /* ============ Плитки ============ */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  .tile {
    position: relative;
    background: var(--card);
    border-radius: 20px;
    padding: 30px 26px 28px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    isolation: isolate;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 10px 30px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(255,255,255,0.8);
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 200px;
    animation: fadeUp 0.5s ease-out both;
  }

  .tile:nth-child(1) { animation-delay: 0.08s; }
  .tile:nth-child(2) { animation-delay: 0.16s; }
  .tile:nth-child(3) { animation-delay: 0.24s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--tile-color-1, #2563eb), var(--tile-color-2, #7c3aed));
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.28s;
    pointer-events: none;
  }

  .tile:hover::before { opacity: 1; }

  .tile:hover {
    transform: translateY(-6px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 26px 50px -12px rgba(15, 23, 42, 0.18);
  }

  .tile:active {
    transform: translateY(-3px);
    transition-duration: 0.1s;
  }

  .tile-glow {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--tile-glow, rgba(37,99,235,0.18)), transparent 70%);
    top: -110px;
    right: -110px;
    pointer-events: none;
    transition: transform 0.5s ease-out;
  }

  .tile:hover .tile-glow {
    transform: scale(1.25);
  }

  .tile-icon {
    width: 56px;
    height: 56px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    color: #fff;
    position: relative;
    z-index: 2;
    box-shadow: 0 10px 22px -8px var(--tile-shadow, rgba(37,99,235,0.5));
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .tile:hover .tile-icon {
    transform: scale(1.06) rotate(-3deg);
  }

  .tile-body {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tile-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--ink);
    line-height: 1.25;
  }

  .tile-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .tile-arrow {
    position: absolute;
    bottom: 22px;
    right: 22px;
    font-size: 18px;
    color: var(--ink-soft);
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.28s;
    z-index: 2;
  }

  .tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(0);
    color: var(--tile-color-1, #2563eb);
  }

  /* --- Цвета плиток --- */
  .tile-vin {
    --tile-color-1: #2563eb;
    --tile-color-2: #06b6d4;
    --tile-shadow: rgba(37, 99, 235, 0.55);
    --tile-glow: rgba(59, 130, 246, 0.22);
  }
  .tile-vin .tile-icon {
    background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
  }

  .tile-works {
    --tile-color-1: #7c3aed;
    --tile-color-2: #db2777;
    --tile-shadow: rgba(124, 58, 237, 0.55);
    --tile-glow: rgba(168, 85, 247, 0.22);
  }
  .tile-works .tile-icon {
    background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
  }

  .tile-photo {
    --tile-color-1: #059669;
    --tile-color-2: #10b981;
    --tile-shadow: rgba(5, 150, 105, 0.55);
    --tile-glow: rgba(16, 185, 129, 0.22);
  }
  .tile-photo .tile-icon {
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
  }

  /* ============ Футер ============ */
  .footer {
    text-align: center;
    padding: 18px 22px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .footer b {
    color: var(--ink);
    font-weight: 600;
  }

  /* ============ Мобильные ============ */
  @media (max-width: 640px) {
    body { padding: 18px 14px; }
    .header { padding: 16px 18px; border-radius: 16px; margin-bottom: 22px; }
    .brand-logo { width: 40px; height: 40px; font-size: 19px; border-radius: 11px; }
    .brand-title { font-size: 16px; }
    .brand-sub { font-size: 12px; }
    .user-nav .uname { padding-right: 8px; font-size: 13px; }
    .user-nav a { padding: 7px 12px; font-size: 12px; }
    .tiles { gap: 14px; }
    .tile { padding: 22px 20px; min-height: 170px; border-radius: 16px; }
    .tile-icon { width: 48px; height: 48px; font-size: 22px; border-radius: 13px; }
    .tile-title { font-size: 17px; }
    .tile-desc { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="loading">Проверка авторизации…</div>
  <div id="app" style="display:none;"></div>
</div>

<script>
fetch('check_auth.php', { credentials: 'same-origin' })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.authorized) {
      window.location.href = 'login.php';
      return;
    }
    document.getElementById('loading').style.display = 'none';
    var app = document.getElementById('app');
    app.style.display = 'block';
    app.innerHTML =
      '<div class="header">' +
        '<div class="brand">' +
          '<div class="brand-logo">🔧</div>' +
          '<div>' +
            '<div class="brand-title">Рабочее место</div>' +
            '<div class="brand-sub">инженер по гарантии · IPG</div>' +
          '</div>' +
        '</div>' +
        '<div class="user-nav">' +
          '<span class="uname">👤 <b>' + escapeHtml(data.name) + '</b></span>' +
          '<a href="profile.php" class="profile">Профиль</a>' +
          (data.is_admin ? '<a href="admin.php" class="admin">🛡️ Админ</a>' : '') +
          '<a href="logout.php" class="logout">Выйти</a>' +
        '</div>' +
      '</div>' +

      '<div class="tiles">' +

        '<a href="search_vin.php" class="tile tile-vin">' +
          '<div class="tile-glow"></div>' +
          '<div class="tile-icon">🔍</div>' +
          '<div class="tile-body">' +
            '<div class="tile-title">Поиск по VIN — КАМАЗ</div>' +
            '<div class="tile-desc">Данные по автотехнике из 1С:ГОА — гарантия, узлы, ОТМ, акции</div>' +
          '</div>' +
          '<div class="tile-arrow">→</div>' +
        '</a>' +

        '<a href="works_brand.php" class="tile tile-works">' +
          '<div class="tile-glow"></div>' +
          '<div class="tile-icon">🛠</div>' +
          '<div class="tile-body">' +
            '<div class="tile-title">Поиск по работам</div>' +
          '</div>' +
          '<div class="tile-arrow">→</div>' +
        '</a>' +

        '<a href="gallery.php" class="tile tile-photo">' +
          '<div class="tile-glow"></div>' +
          '<div class="tile-icon">📸</div>' +
          '<div class="tile-body">' +
            '<div class="tile-title">Фото по РА</div>' +
            '<div class="tile-desc">Прикреплять фото к рекламационным актам</div>' +
          '</div>' +
          '<div class="tile-arrow">→</div>' +
        '</a>' +

      '</div>' +

      '<div class="footer">Данные сохраняются в облаке · Работает на <b>RelaxDev</b> · Версия 2.2</div>';
  })
  .catch(function() {
    document.getElementById('loading').innerHTML = '❌ Ошибка загрузки. Обновите страницу.';
  });

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
