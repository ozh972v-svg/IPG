<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Генератор иконок IPG</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#0b1220;color:#fff;
       padding:24px;max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  p{opacity:.8;line-height:1.5}
  code{background:#1e293b;padding:1px 6px;border-radius:4px}
  .row{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px}
  .item{text-align:center}
  canvas{background:#111;border-radius:12px;display:block}
  .lbl{font-size:12px;opacity:.75;margin-top:6px}
  a.dl{display:inline-block;margin-top:8px;padding:7px 14px;background:#2563eb;
       color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
  a.dl:hover{background:#1d4ed8}
</style>
</head>
<body>
<h1>Генератор иконок IPG</h1>
<p>Нажми «Скачать» под каждой иконкой → положи PNG в папку <code>/icons/</code> на хостинге.
   После этого <code>generator.html</code> можно удалить.</p>

<div class="row" id="row"></div>

<script>
const ICONS = [
  { name: 'icon-192.png',            size: 192, style: 'rounded'  },
  { name: 'icon-512.png',            size: 512, style: 'rounded'  },
  { name: 'icon-maskable-512.png',   size: 512, style: 'full'     },
  { name: 'apple-touch-icon.png',    size: 180, style: 'full'     }
];

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawIcon(size, style) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // Градиент как у плиток: сине-бирюзовый
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#2563eb');
  g.addColorStop(1, '#06b6d4');

  // Для maskable и apple — фон на всю площадь (маску накладывает система).
  // Для обычных — скруглённый квадрат.
  if (style === 'full') {
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  } else {
    const pad = size * 0.06;
    const s   = size - pad * 2;
    roundRect(ctx, pad, pad, s, s, s * 0.22);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // Текст IPG. Для maskable/apple — уменьшаем (safe zone ~80%).
  const textScale = (style === 'full') ? 0.62 : 0.78;
  const fontSize  = size * textScale * 0.55;
  ctx.font = '800 ' + fontSize + 'px system-ui, -apple-system, "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = size * 0.03;
  ctx.shadowOffsetY = size * 0.012;
  ctx.fillText('IPG', size / 2, size / 2 + fontSize * 0.02);

  return c;
}

const row = document.getElementById('row');
ICONS.forEach(function (ic) {
  const full = drawIcon(ic.size, ic.style);

  const prev = document.createElement('canvas');
  prev.width = prev.height = 128;
  prev.getContext('2d').drawImage(full, 0, 0, 128, 128);

  const item  = document.createElement('div');
  item.className = 'item';

  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = ic.name + ' · ' + ic.size + 'px · ' + ic.style;

  const a = document.createElement('a');
  a.className = 'dl';
  a.textContent = 'Скачать';
  a.download = ic.name;
  full.toBlob(function (blob) {
    a.href = URL.createObjectURL(blob);
  });

  item.appendChild(prev);
  item.appendChild(lbl);
  item.appendChild(a);
  row.appendChild(item);
});
</script>
</body>
</html>
